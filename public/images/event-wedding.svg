<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a574;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c7913f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5e6d3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8d4b8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="#faf7f2"/>

  <!-- Decorative mandala pattern -->
  <g transform="translate(300, 200)">
    <!-- Outer circle -->
    <circle r="140" fill="none" stroke="#d4a574" stroke-width="1.5" opacity="0.3"/>
    <circle r="130" fill="none" stroke="#d4a574" stroke-width="1" opacity="0.4"/>

    <!-- Petal patterns -->
    <g opacity="0.6">
      <path d="M 0,-120 Q 15,-130 0,-140 Q -15,-130 0,-120" fill="url(#grad1)" transform="rotate(0)"/>
      <path d="M 0,-120 Q 15,-130 0,-140 Q -15,-130 0,-120" fill="url(#grad1)" transform="rotate(30)"/>
      <path d="M 0,-120 Q 15,-130 0,-140 Q -15,-130 0,-120" fill="url(#grad1)" transform="rotate(60)"/>
      <path d="M 0,-120 Q 15,-130 0,-140 Q -15,-130 0,-120" fill="url(#grad1)" transform="rotate(90)"/>
      <path d="M 0,-120 Q 15,-130 0,-140 Q -15,-130 0,-120" fill="url(#grad1)" transform="rotate(120)"/>
      <path d="M 0,-120 Q 15,-130 0,-140 Q -15,-130 0,-120" fill="url(#grad1)" transform="rotate(150)"/>
      <path d="M 0,-120 Q 15,-130 0,-140 Q -15,-130 0,-120" fill="url(#grad1)" transform="rotate(180)"/>
      <path d="M 0,-120 Q 15,-130 0,-140 Q -15,-130 0,-120" fill="url(#grad1)" transform="rotate(210)"/>
      <path d="M 0,-120 Q 15,-130 0,-140 Q -15,-130 0,-120" fill="url(#grad1)" transform="rotate(240)"/>
      <path d="M 0,-120 Q 15,-130 0,-140 Q -15,-130 0,-120" fill="url(#grad1)" transform="rotate(270)"/>
      <path d="M 0,-120 Q 15,-130 0,-140 Q -15,-130 0,-120" fill="url(#grad1)" transform="rotate(300)"/>
      <path d="M 0,-120 Q 15,-130 0,-140 Q -15,-130 0,-120" fill="url(#grad1)" transform="rotate(330)"/>
    </g>

    <!-- Middle layer -->
    <circle r="100" fill="none" stroke="#c7913f" stroke-width="2" opacity="0.5"/>

    <!-- Inner petals -->
    <g opacity="0.7">
      <ellipse rx="8" ry="25" fill="#d4a574" transform="translate(0, -80) rotate(0)"/>
      <ellipse rx="8" ry="25" fill="#d4a574" transform="translate(0, -80) rotate(45)"/>
      <ellipse rx="8" ry="25" fill="#d4a574" transform="translate(0, -80) rotate(90)"/>
      <ellipse rx="8" ry="25" fill="#d4a574" transform="translate(0, -80) rotate(135)"/>
      <ellipse rx="8" ry="25" fill="#d4a574" transform="translate(0, -80) rotate(180)"/>
      <ellipse rx="8" ry="25" fill="#d4a574" transform="translate(0, -80) rotate(225)"/>
      <ellipse rx="8" ry="25" fill="#d4a574" transform="translate(0, -80) rotate(270)"/>
      <ellipse rx="8" ry="25" fill="#d4a574" transform="translate(0, -80) rotate(315)"/>
    </g>

    <!-- Center circle -->
    <circle r="50" fill="url(#grad2)"/>
    <circle r="45" fill="none" stroke="#c7913f" stroke-width="1.5"/>

    <!-- Center symbol - hands in blessing gesture -->
    <g transform="scale(0.8)">
      <path d="M -15,-10 L -15,10 Q -15,15 -10,15 L 10,15 Q 15,15 15,10 L 15,-10 Q 15,-15 10,-15 L -10,-15 Q -15,-15 -15,-10 Z"
            fill="none" stroke="#c7913f" stroke-width="2"/>
      <circle cx="0" cy="0" r="8" fill="#d4a574"/>
    </g>

    <!-- Decorative dots -->
    <circle cx="0" cy="-60" r="3" fill="#c7913f" opacity="0.6"/>
    <circle cx="0" cy="60" r="3" fill="#c7913f" opacity="0.6"/>
    <circle cx="-60" cy="0" r="3" fill="#c7913f" opacity="0.6"/>
    <circle cx="60" cy="0" r="3" fill="#c7913f" opacity="0.6"/>
  </g>

  <!-- Decorative corner elements -->
  <path d="M 20,20 Q 40,20 40,40" fill="none" stroke="#d4a574" stroke-width="1.5" opacity="0.4"/>
  <path d="M 580,20 Q 560,20 560,40" fill="none" stroke="#d4a574" stroke-width="1.5" opacity="0.4"/>
  <path d="M 20,380 Q 40,380 40,360" fill="none" stroke="#d4a574" stroke-width="1.5" opacity="0.4"/>
  <path d="M 580,380 Q 560,380 560,360" fill="none" stroke="#d4a574" stroke-width="1.5" opacity="0.4"/>
</svg>
