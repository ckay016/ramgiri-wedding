<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bgrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8c46a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4a574;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fef9f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5e6d3;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="120" cy="120" r="120" fill="#faf7f2"/>

  <!-- Decorative rings -->
  <circle cx="120" cy="120" r="110" fill="none" stroke="#e8c46a" stroke-width="1" opacity="0.3"/>
  <circle cx="120" cy="120" r="100" fill="none" stroke="#d4a574" stroke-width="1.5" opacity="0.4"/>

  <!-- Traditional Kalash/Pot -->
  <g transform="translate(120, 120)">
    <!-- Pot body -->
    <path d="M -35,10 Q -40,0 -35,-20 L -30,-40 Q -25,-45 0,-45 Q 25,-45 30,-40 L 35,-20 Q 40,0 35,10 Z"
          fill="url(#bgrad2)" stroke="#c7913f" stroke-width="2"/>

    <!-- Pot neck -->
    <rect x="-15" y="-50" width="30" height="10" rx="2" fill="url(#bgrad1)" stroke="#c7913f" stroke-width="1.5"/>

    <!-- Pot base -->
    <ellipse cy="10" rx="38" ry="8" fill="url(#bgrad1)"/>
    <ellipse cy="10" rx="35" ry="6" fill="url(#bgrad2)"/>

    <!-- Decorative bands on pot -->
    <path d="M -32,-10 Q 0,-8 32,-10" fill="none" stroke="#c7913f" stroke-width="1" opacity="0.6"/>
    <path d="M -30,0 Q 0,2 30,0" fill="none" stroke="#c7913f" stroke-width="1" opacity="0.6"/>

    <!-- Coconut on top -->
    <circle cy="-55" r="12" fill="#c7913f"/>
    <circle cy="-55" r="10" fill="url(#bgrad1)"/>
    <path d="M -6,-58 L -2,-52" stroke="#8b6f3f" stroke-width="1"/>
    <path d="M 0,-59 L 0,-52" stroke="#8b6f3f" stroke-width="1"/>
    <path d="M 6,-58 L 2,-52" stroke="#8b6f3f" stroke-width="1"/>

    <!-- Mango leaves -->
    <g opacity="0.8">
      <!-- Left leaves -->
      <path d="M -15,-50 Q -25,-60 -30,-55 Q -25,-50 -20,-48" fill="#7a9b5e" opacity="0.7"/>
      <path d="M -10,-52 Q -18,-65 -22,-62 Q -18,-55 -12,-51" fill="#7a9b5e" opacity="0.7"/>

      <!-- Right leaves -->
      <path d="M 15,-50 Q 25,-60 30,-55 Q 25,-50 20,-48" fill="#7a9b5e" opacity="0.7"/>
      <path d="M 10,-52 Q 18,-65 22,-62 Q 18,-55 12,-51" fill="#7a9b5e" opacity="0.7"/>

      <!-- Center leaves -->
      <path d="M 0,-52 Q -5,-68 0,-70 Q 5,-68 0,-52" fill="#7a9b5e" opacity="0.7"/>
    </g>

    <!-- Decorative dots -->
    <circle cx="-20" cy="-15" r="2" fill="#e8c46a" opacity="0.8"/>
    <circle cx="20" cy="-15" r="2" fill="#e8c46a" opacity="0.8"/>
    <circle cx="0" cy="-25" r="2" fill="#e8c46a" opacity="0.8"/>
  </g>

  <!-- Outer decorative elements -->
  <g opacity="0.5">
    <circle cx="120" cy="30" r="3" fill="#d4a574"/>
    <circle cx="120" cy="210" r="3" fill="#d4a574"/>
    <circle cx="30" cy="120" r="3" fill="#d4a574"/>
    <circle cx="210" cy="120" r="3" fill="#d4a574"/>
  </g>
</svg>
