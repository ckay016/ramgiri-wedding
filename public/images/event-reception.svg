<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8c46a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4a574;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fef9f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5e6d3;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="#faf7f2"/>

  <!-- Central decorative element -->
  <g transform="translate(300, 200)">
    <!-- Outer frame -->
    <rect x="-120" y="-80" width="240" height="160" fill="none" stroke="#d4a574" stroke-width="2" opacity="0.4"/>
    <rect x="-110" y="-70" width="220" height="140" fill="none" stroke="#d4a574" stroke-width="1" opacity="0.3"/>

    <!-- Elegant chandelier/lamp silhouette -->
    <g opacity="0.7">
      <!-- Top ornament -->
      <circle cy="-50" r="8" fill="url(#grad3)"/>
      <path d="M 0,-42 L 0,-30" stroke="#c7913f" stroke-width="2"/>

      <!-- Main lamp body -->
      <ellipse rx="35" ry="45" fill="url(#grad4)" stroke="#d4a574" stroke-width="1.5"/>

      <!-- Decorative bands -->
      <line x1="-30" y1="-20" x2="30" y2="-20" stroke="#c7913f" stroke-width="1" opacity="0.6"/>
      <line x1="-30" y1="0" x2="30" y2="0" stroke="#c7913f" stroke-width="1" opacity="0.6"/>
      <line x1="-30" y1="20" x2="30" y2="20" stroke="#c7913f" stroke-width="1" opacity="0.6"/>

      <!-- Bottom ornament -->
      <path d="M 0,45 L 0,55" stroke="#c7913f" stroke-width="2"/>
      <circle cy="58" r="4" fill="#e8c46a"/>
    </g>

    <!-- Side decorative elements -->
    <g opacity="0.5">
      <!-- Left -->
      <path d="M -80,-60 Q -90,-60 -90,-50 L -90,50 Q -90,60 -80,60"
            fill="none" stroke="#d4a574" stroke-width="1.5"/>
      <circle cx="-80" cy="-60" r="4" fill="#e8c46a"/>
      <circle cx="-80" cy="0" r="4" fill="#e8c46a"/>
      <circle cx="-80" cy="60" r="4" fill="#e8c46a"/>

      <!-- Right -->
      <path d="M 80,-60 Q 90,-60 90,-50 L 90,50 Q 90,60 80,60"
            fill="none" stroke="#d4a574" stroke-width="1.5"/>
      <circle cx="80" cy="-60" r="4" fill="#e8c46a"/>
      <circle cx="80" cy="0" r="4" fill="#e8c46a"/>
      <circle cx="80" cy="60" r="4" fill="#e8c46a"/>
    </g>
  </g>

  <!-- Decorative flourishes in corners -->
  <g opacity="0.4">
    <circle cx="50" cy="50" r="3" fill="#d4a574"/>
    <circle cx="70" cy="50" r="2" fill="#d4a574"/>
    <circle cx="50" cy="70" r="2" fill="#d4a574"/>

    <circle cx="550" cy="50" r="3" fill="#d4a574"/>
    <circle cx="530" cy="50" r="2" fill="#d4a574"/>
    <circle cx="550" cy="70" r="2" fill="#d4a574"/>

    <circle cx="50" cy="350" r="3" fill="#d4a574"/>
    <circle cx="70" cy="350" r="2" fill="#d4a574"/>
    <circle cx="50" cy="330" r="2" fill="#d4a574"/>

    <circle cx="550" cy="350" r="3" fill="#d4a574"/>
    <circle cx="530" cy="350" r="2" fill="#d4a574"/>
    <circle cx="550" cy="330" r="2" fill="#d4a574"/>
  </g>

  <!-- Top and bottom decorative lines -->
  <path d="M 100,50 L 200,50" stroke="#d4a574" stroke-width="1" opacity="0.3"/>
  <path d="M 400,50 L 500,50" stroke="#d4a574" stroke-width="1" opacity="0.3"/>
  <path d="M 100,350 L 200,350" stroke="#d4a574" stroke-width="1" opacity="0.3"/>
  <path d="M 400,350 L 500,350" stroke="#d4a574" stroke-width="1" opacity="0.3"/>
</svg>
